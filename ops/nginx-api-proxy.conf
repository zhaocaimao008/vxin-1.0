# V信 Nginx 配置 v3.2 — 极致性能优化版
# 优化项：gzip_static / 长期缓存 / 安全头 / HTTP/2 / 上行带宽 / 连接复用

upstream vxin_backend {
    server 127.0.0.1:3002;
    keepalive 64;          # 连接池增大（高并发 WebSocket + API）
    keepalive_timeout 65s;
    keepalive_requests 1000;
}

# ── HTTP → HTTPS 301 跳转 ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vxinchat.com www.vxinchat.com;
    return 301 https://$host$request_uri;
}

# ── 主 HTTPS 服务 ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vxinchat.com www.vxinchat.com;

    # ── TLS ────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/vxinchat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vxinchat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;   # 10MB 会话缓存（减少 TLS 握手开销）
    ssl_session_timeout 1d;
    ssl_session_tickets off;            # 安全：禁用 session tickets（前向保密）
    ssl_stapling on;                    # OCSP stapling：减少证书验证延迟
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── 安全响应头（与后端协同，避免重复）─────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root  /var/www/html;
    index index.html;

    # ── 全局 Gzip（动态内容）──────────────────────────────────────
    gzip on;
    gzip_vary on;           # Vary: Accept-Encoding（CDN 正确缓存两版本）
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/x-javascript application/xml+rss
        image/svg+xml font/woff font/woff2;

    # ── /downloads/ 客户端安装包静态服务 ──────────────────────────
    location /downloads/ {
        expires 7d;
        add_header Cache-Control 'public';
        add_header X-Content-Type-Options nosniff;
    }

    # ── /updates/ Windows 自动更新 ───────────────────────────────
    location /updates/ {
        if (!-e $request_filename) { return 404; }
    }

    # ── 后台 admin：IP 白名单保护 ─────────────────────────────────
    location /api/admin {
        allow 127.0.0.1; allow ::1;
        allow 103.101.207.141; allow 45.88.42.27; allow 93.179.127.50;
        deny all;

        proxy_pass         http://vxin_backend/admin;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/vxin-admin-login {
        allow 127.0.0.1; allow ::1;
        allow 103.101.207.141; allow 45.88.42.27; allow 93.179.127.50;
        deny all;

        proxy_pass       http://vxin_backend/vxin-admin-login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API 反向代理（含 WebSocket / Socket.IO）──────────────────
    location /api/ {
        proxy_pass         http://vxin_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  200M;  # 对齐后端 MAX_UPLOAD_BYTES
        # 缓冲区：大文件上传时不写临时文件
        proxy_request_buffering off;
    }

    # ── Socket.IO 长连接（单独优化）─────────────────────────────
    location /socket.io/ {
        proxy_pass         http://vxin_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # WebSocket 长连接不超时
        proxy_send_timeout 3600s;
    }

    # ── 健康检查（不记日志，减少磁盘 IO）────────────────────────
    location /health {
        proxy_pass http://vxin_backend/health;
        access_log off;
    }

    # ── 上传文件静态服务（鉴权由后端 /api/ 路由处理）────────────
    location /uploads/ {
        expires 30d;
        add_header Cache-Control 'public';
        add_header X-Content-Type-Options nosniff;
        # 非图片/音视频文件强制下载（防 XSS，双重保险）
        location ~* \.(html|htm|svg|js|php|exe|sh|py)$ {
            add_header Content-Disposition attachment;
            return 403;
        }
    }

    # ── Vite 打包静态资源：极长期缓存（带 hash，永不过期）───────
    # gzip_static：优先发送 .gz 预压缩文件（Vite build 已生成），
    # 零 CPU 压缩开销，速度是动态 gzip 的 10 倍以上。
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|png|jpg|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable' always;
        add_header Vary 'Accept-Encoding' always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Access-Control-Allow-Origin '*';
        gzip_static on;
    }

    # ── 其他静态文件（图标、manifest 等）────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control 'public';
        gzip_static on;
    }

    # ── SPA 路由：所有未匹配路径回落到 index.html ─────────────
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存（每次检查是否有更新），同时附加所有安全头
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header Pragma no-cache always;
        add_header Expires 0 always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
