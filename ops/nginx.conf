user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
}

http {
    client_max_body_size 1124m;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── 全局安全响应头（所有 server/location 继承）─────────────
    # 注：子 location 有自己的 add_header 时会覆盖，已在 vxin-api-proxy.conf 的关键 location 中重复声明
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ===== HTTP → HTTPS 强制跳转 =====
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name vxinchat.com www.vxinchat.com _;

        # Let's Encrypt 验证
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # API 反向代理
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 文件上传
        location ^~ /uploads {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
        }

        # Socket.IO WebSocket
        location ^~ /socket.io {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 健康检查# Xray VLESS WebSocket 代理入口    location /xray {        proxy_pass http://127.0.0.1:10000;        proxy_http_version 1.1;        proxy_set_header Upgrade $http_upgrade;        proxy_set_header Connection "upgrade";        proxy_set_header Host $host;        proxy_set_header X-Real-IP $remote_addr;    }
        location /health {
            proxy_pass http://127.0.0.1:3002/health;
        }

        # 下载（旧页面 301 到首页下载区）
        location = /download {
            return 301 /welcome/#download;
        }
        location /downloads/updates/ {
            alias /var/www/html/downloads/updates/;
            autoindex off;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
        location /downloads/ {
            alias /var/www/downloads/;
            add_header Content-Disposition "attachment";
            add_header Cache-Control "no-cache";
        }

        # 其他所有请求 → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== HTTPS 服务器 =====
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name vxinchat.com www.vxinchat.com;

        ssl_certificate /etc/letsencrypt/live/vxinchat.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vxinchat.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;

        # ── 全局安全头（在此 server 生效的最外层 location 要重复，因 Nginx 不继承子 location）──
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), interest-cohort=()" always;

        # ── Gzip 动态压缩 ──
        gzip on;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_min_length 512;
        gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

        index index.html;

        # ===== Windows 客户端更新文件（优先级最高） =====
        location /updates/ {
            root /var/www/html;
            autoindex off;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # -- config.json --
        location = /config.json {
            root /var/www/html;
            types { } default_type application/json;
            add_header Cache-Control no-cache always;
        }

        # ── Web 应用（根路径）──
        location / {
            root /root/v信/web/dist;
            try_files $uri $uri/ /index.html;
            # index.html 不缓存，安全头
            add_header Cache-Control "no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # assets: 含内容 hash，永不过期，gzip_static 零CPU压缩
        location /assets/ {
            root /root/v信/web/dist;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header Vary "Accept-Encoding" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options nosniff always;
            gzip_static on;
            try_files $uri =404;
        }

        location = /index.html {
            root /root/v信/web/dist;
            add_header Cache-Control "no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # ── 落地页（/welcome/ 路径）──
        location = /welcome {
            return 301 /welcome/;
        }
        location /welcome/ {
            alias /root/v信/landing/out/;
            try_files $uri $uri/ /welcome/index.html;
        }

        # ── 网页版聊天（/chat/ 路径）──
        location /chat/ {
            alias /root/v信/web/dist/;
            index index.html;

            location = /chat/index.html {
                add_header Cache-Control "no-store, must-revalidate" always;
            }

            # SPA fallback
            try_files $uri $uri/ /chat/index.html;
        }

        # ── API 反向代理 ──
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── 文件上传 ──
        location ^~ /uploads {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
        }

        # ── Socket.IO WebSocket ──
        location ^~ /socket.io {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── 健康检查 ──# Xray VLESS WebSocket 代理入口    location /xray {        proxy_pass http://127.0.0.1:10000;        proxy_http_version 1.1;        proxy_set_header Upgrade $http_upgrade;        proxy_set_header Connection "upgrade";        proxy_set_header Host $host;        proxy_set_header X-Real-IP $remote_addr;    }
        location /health {
            proxy_pass http://127.0.0.1:3002/health;
        }

        # ── 下载（旧页面 301 到首页下载区）──
        location = /download {
            return 301 /welcome/#download;
        }
        location /downloads/updates/ {
            alias /var/www/html/downloads/updates/;
            autoindex off;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
        location /downloads/ {
            alias /var/www/downloads/;
            add_header Content-Disposition "attachment";
            add_header Cache-Control "no-cache";
        }

        # ── 后台管理面板 ──
        location /admin/ {
            root /root/v信;
            index index.html;

            location = /admin/index.html {
                add_header Cache-Control "no-store, must-revalidate" always;
            }

            try_files $uri $uri/ /admin/index.html;
        }


    }
}

