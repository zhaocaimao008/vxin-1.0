<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="energyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="120" fill="#000000" />
  <circle cx="128" cy="128" r="100" fill="url(#energyGlow)" opacity="0.4" />
  <circle cx="128" cy="128" r="100" fill="none" stroke="#444444" stroke-width="1" opacity="0.6" />
  <circle cx="128" cy="128" r="90" fill="none" stroke="#444444" stroke-width="0.5" opacity="0.4" stroke-dasharray="5,3" />

  <g filter="url(#glow)">
    <circle cx="75" cy="90" r="1.5" fill="#FFD700" opacity="0.8" />
    <circle cx="90" cy="70" r="1" fill="#FFA500" opacity="0.7" />
    <circle cx="160" cy="85" r="1.2" fill="#FFD700" opacity="0.75" />
    <circle cx="175" cy="100" r="0.8" fill="#FF8C00" opacity="0.65" />
    <circle cx="65" cy="140" r="1" fill="#FFD700" opacity="0.7" />
    <circle cx="185" cy="150" r="1" fill="#FFA500" opacity="0.75" />
  </g>

  <path d="M 80 70 Q 80 60 90 60 L 166 60 Q 176 60 176 70 L 176 145 Q 176 155 166 155 L 110 155 L 85 175 L 85 155 L 90 155 Q 80 155 80 145 Z"
        fill="#1a1a1a" stroke="url(#goldGradient)" stroke-width="1" opacity="0.9" />

  <g transform="translate(128, 107)">
    <path d="M -30 -25 L -10 25 L 10 25 L 30 -25 L 15 -25 L 0 5 L -15 -25 Z"
          fill="url(#goldGradient)" stroke="#FFD700" stroke-width="1" />
    <path d="M -30 -25 L -10 25 L 10 25 L 30 -25 L 15 -25 L 0 5 L -15 -25 Z"
          fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3" filter="url(#glow)" />
  </g>

  <circle cx="128" cy="107" r="35" fill="none" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.5" />

  <g fill="#FFD700" opacity="0.3">
    <circle cx="128" cy="45" r="1" />
    <circle cx="128" cy="170" r="1" />
    <circle cx="60" cy="107" r="1" />
    <circle cx="196" cy="107" r="1" />
  </g>
</svg>
