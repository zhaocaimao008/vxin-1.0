<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    V信 App 主图标 — 2026-09-10 重绘，替代旧版 logo.svg（多层科技轨道圆环+
    粒子发光效果，小尺寸下糊成一团，见 FIX_PROGRESS_20260909.md 批次6）。
    黑底 + 金色 V 形折线 + 独立尾点，全平台图标统一底稿：iOS/Windows/favicon/
    PWA 直接用本文件；Android 自适应图标前景另用 icon-mark.svg（透明底）+
