name: Android Release APK (signed)

# 云端打「正式签名版」原生 APK（Kotlin/Compose）：用同一套密钥签名，可覆盖升级、可上架。
# 用法：本仓库 → Actions → 「Android Release APK (signed)」→ Run workflow。
# 手动运行只构建；android-v* tag 在现有 self-hosted runner 发布。
# 需要 4 个仓库 Secret：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#                       ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（已配置）。
on:
  workflow_dispatch:
  push:
    tags:
      # 仅安卓端专属前缀触发；避免裸 v* 同时误触发桌面端/iOS 发布（详见 VERSIONING.md）。
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;33.0.1'

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/vxin-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/vxin-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 个推 SDK manifestPlaceholders（未配置时为空串，SDK 以 no-op 运行）
          GETUI_APP_ID: ${{ secrets.GETUI_APP_ID }}
          GETUI_APP_KEY: ${{ secrets.GETUI_APP_KEY }}
          GETUI_APP_SECRET: ${{ secrets.GETUI_APP_SECRET }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace --no-daemon
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/33.0.1/apksigner" verify --verbose "$APK"
          VN=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VC=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "android-v$VN"; fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          jq -n --arg versionName "$VN" --argjson versionCode "$VC" --arg sha256 "$SHA" --arg url "https://vxinchat.com/downloads/vxin-android-$VN.apk" '{versionName:$versionName,versionCode:$versionCode,sha256:$sha256,url:$url,notes:"修复页面恢复、账号与服务器隔离、重发及缓存问题。"}' > app/build/outputs/apk/release/vxin-android-version.json

      - name: Upload signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vxin-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/vxin-android-version.json
          if-no-files-found: error


  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: [self-hosted, linux, x64, vxin-prod-deploy]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vxin-release-apk
          path: ${{ runner.temp }}/vxin-android-${{ github.run_id }}/artifacts
      - name: Publish verified signed APK and update manifest
        shell: bash
        working-directory: ${{ runner.temp }}/vxin-android-${{ github.run_id }}
        run: |
          set -euo pipefail
          TARGET=/var/www/vxin-download
          APK=$(find artifacts -name '*.apk' -print -quit)
          MANIFEST=artifacts/vxin-android-version.json
          VERSION=$(jq -r .versionName "$MANIFEST")
          EXPECTED=$(jq -r .sha256 "$MANIFEST")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = "$EXPECTED"
          mkdir -p "$TARGET"
          BACKUP=$(mktemp -d "$TARGET/.android-backup-XXXXXX")
          for name in vxin-android-latest.apk vxin-android-version.json; do
            if [[ -f "$TARGET/$name" ]]; then cp -a "$TARGET/$name" "$BACKUP/$name"; fi
          done
          rollback() {
            for name in vxin-android-latest.apk vxin-android-version.json; do
              if [[ -f "$BACKUP/$name" ]]; then cp -a "$BACKUP/$name" "$TARGET/$name"; else rm -f "$TARGET/$name"; fi
            done
          }
          trap 'rollback' ERR
          cp "$APK" "$TARGET/.android-new.apk"
          mv "$TARGET/.android-new.apk" "$TARGET/vxin-android-$VERSION.apk"
          cp "$TARGET/vxin-android-$VERSION.apk" "$TARGET/.android-latest.apk"
          mv "$TARGET/.android-latest.apk" "$TARGET/vxin-android-latest.apk"
          cp "$MANIFEST" "$TARGET/.android-version.json"
          mv "$TARGET/.android-version.json" "$TARGET/vxin-android-version.json"
          curl --fail --silent --show-error --max-time 30 "https://vxinchat.com/downloads/vxin-android-$VERSION.apk" -o "$BACKUP/live.apk"
          test "$(sha256sum "$BACKUP/live.apk" | cut -d' ' -f1)" = "$EXPECTED"
          curl --fail --silent --show-error --max-time 10 "https://vxinchat.com/downloads/vxin-android-version.json?release=$VERSION" | jq -e --arg v "$VERSION" '.versionName == $v'
          trap - ERR
          echo "Published signed Android $VERSION; previous files retained at $BACKUP"
