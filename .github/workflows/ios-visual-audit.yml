name: iOS Visual Audit

on:
  workflow_dispatch:

jobs:
  visual-audit:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Vxin.xcodeproj \
            -scheme Vxin

      - name: Build for Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Vxin.xcodeproj \
            -scheme Vxin \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("iPhone")) | .udid] | first')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator found"; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using iPhone simulator UDID: $UDID"

      - name: Boot simulator
        run: |
          xcrun simctl boot ${{ steps.sim.outputs.udid }} || true
          xcrun simctl bootstatus ${{ steps.sim.outputs.udid }}

      - name: Force Light Mode
        run: |
          xcrun simctl ui ${{ steps.sim.outputs.udid }} appearance light

      - name: Install app
        working-directory: ios
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Vxin.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "App not found in DerivedData"
            exit 1
          fi
          echo "Installing: $APP_PATH"
          xcrun simctl install ${{ steps.sim.outputs.udid }} "$APP_PATH"

      - name: Launch app and wait
        run: |
          xcrun simctl launch ${{ steps.sim.outputs.udid }} com.vxin.app
          sleep 5

      - name: Create screenshots directory
        run: mkdir -p ios-screenshots

      - name: Screenshot - Login
        run: |
          xcrun simctl io ${{ steps.sim.outputs.udid }} screenshot ios-screenshots/01-login.png
          sleep 2

      - name: Screenshot - Dark appearance
        run: |
          xcrun simctl ui ${{ steps.sim.outputs.udid }} appearance dark
          xcrun simctl launch --terminate-running-process ${{ steps.sim.outputs.udid }} com.vxin.app
          sleep 5
          xcrun simctl io ${{ steps.sim.outputs.udid }} screenshot ios-screenshots/02-login-dark.png

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated native UI driver
        run: |
          npm install --prefix "$RUNNER_TEMP/vxin-appium" --no-audit --no-fund appium@3
          "$RUNNER_TEMP/vxin-appium/node_modules/.bin/appium" driver install xcuitest
          python3 -m venv "$RUNNER_TEMP/vxin-qa-python"
          "$RUNNER_TEMP/vxin-qa-python/bin/pip" install Appium-Python-Client
          "$RUNNER_TEMP/vxin-appium/node_modules/.bin/appium" --log-level error --log "$RUNNER_TEMP/appium-private.log" > /dev/null 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4723/status > /dev/null; then break; fi; sleep 1; done
      - name: Real login, messaging, groups and draft persistence on iPhone simulator
        env:
          VXIN_ACCEPTANCE_ACCOUNTS_JSON: ${{ secrets.VXIN_ACCEPTANCE_ACCOUNTS_JSON }}
          QA_OUTPUT: ios-screenshots
          IOS_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          "$RUNNER_TEMP/vxin-qa-python/bin/python" e2e/scripts/native-live-acceptance.py ios

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-visual-audit-screenshots
          path: ios-screenshots/
          if-no-files-found: error

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown ${{ steps.sim.outputs.udid }} || true
