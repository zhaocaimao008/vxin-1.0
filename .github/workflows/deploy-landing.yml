name: 部署官网 (landing → vxinchat.com)

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
      - uses: actions/upload-artifact@v4
        with:
          name: landing-static
          path: landing/out/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vxin-prod-deploy]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-static
          path: ${{ runner.temp }}/vxin-landing-${{ github.run_id }}/site
      - name: Publish assets before HTML, preserving app and server configuration
        shell: bash
        working-directory: ${{ runner.temp }}/vxin-landing-${{ github.run_id }}
        run: |
          set -euo pipefail
          TARGET=/var/www/vxin-web
          BACKUP=/var/lib/vxin-releases/landing/$GITHUB_RUN_ID
          test -s site/index.html
          test -s "$TARGET/app/index.html"
          # Reject a stale/broken public download before changing the homepage.
          python3 - <<'PYLINKS'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag != 'a': return
                  href = dict(attrs).get('href', '')
                  if '/downloads/' in href and href.endswith(('.exe', '.apk')):
                      subprocess.run(['curl', '--fail', '--silent', '--show-error', '--head', '--max-time', '30', href], check=True, stdout=subprocess.DEVNULL)
          Links().feed(Path('site/index.html').read_text())
          PYLINKS
          mkdir -p "$BACKUP"
          cp -a "$TARGET/index.html" "$BACKUP/index.html"
          if [ -f "$TARGET/landing-release.json" ]; then cp -a "$TARGET/landing-release.json" "$BACKUP/landing-release.json"; fi
          rollback() {
            cp -a "$BACKUP/index.html" "$TARGET/.landing-restore.html"
            mv "$TARGET/.landing-restore.html" "$TARGET/index.html"
            if [ -f "$BACKUP/landing-release.json" ]; then cp -a "$BACKUP/landing-release.json" "$TARGET/landing-release.json"; else rm -f "$TARGET/landing-release.json"; fi
          }
          trap rollback ERR
          # No --delete: app/, config.json and previous hashed assets must survive.
          rsync -a --checksum --exclude=index.html site/ "$TARGET/"
          cp site/index.html "$TARGET/.landing-index.html"
          mv "$TARGET/.landing-index.html" "$TARGET/index.html"
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > "$TARGET/.landing-release.json"
          mv "$TARGET/.landing-release.json" "$TARGET/landing-release.json"
          curl --fail --silent --show-error --max-time 20 "https://vxinchat.com/landing-release.json?release=$GITHUB_SHA" | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha'
          curl --fail --silent --show-error --max-time 20 "https://vxinchat.com/?release=$GITHUB_SHA" > "$BACKUP/published.html"
          grep -F 'vxin-android-8.0.7.apk' "$BACKUP/published.html" > /dev/null
          grep -F 'vxin-8.0.14-setup.exe' "$BACKUP/published.html" > /dev/null
          curl --fail --silent --show-error --max-time 20 https://vxinchat.com/app/ -o /dev/null
          trap - ERR
          echo "Landing published: $GITHUB_SHA; previous HTML: $BACKUP"
