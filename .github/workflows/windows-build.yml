name: Windows Desktop Build

# 在云端 Windows runner 上用 electron-builder 打 Windows 安装包（NSIS .exe）。
# 无需本地/服务器装 wine。用法：Actions →「Windows Desktop Build」→ Run workflow，
# 跑完在底部 Artifacts 下载 vxin-windows-setup。
on:
  workflow_dispatch:
  push:
    tags:
      # 仅桌面端专属前缀触发；避免裸 v* 同时误触发 Android/iOS 发布（详见 VERSIONING.md）。
      - 'desktop-v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web (desktop mode)
        working-directory: web
        run: npx vite build --mode desktop

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop-electron
        # build:win 内部的 build:web 在 Windows cmd 里 cd 可能不生效；
        # web 已在上一步构建好，直接跑 electron-builder 即可。
        run: npx electron-builder --win --x64

      - name: Upload installer + update feed
        uses: actions/upload-artifact@v4
        with:
          name: vxin-windows-setup
          # latest.yml / *.blockmap 是 electron-updater 自动更新所必需：必须与 .exe
          # 一并上传到更新源 https://vxinchat.com/downloads/updates，否则客户端拉不到更新。
          path: |
            desktop-electron/dist/*.exe
            desktop-electron/dist/latest.yml
            desktop-electron/dist/*.blockmap
            desktop-electron/release/*.exe
            desktop-electron/release/latest.yml
            desktop-electron/release/*.blockmap
          if-no-files-found: warn

  deploy:
    name: 部署到香港服务器
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: vxin-windows-setup
          path: artifacts

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: SCP 到服务器
        run: |
          EXE=$(find artifacts -name "*.exe" | head -1)
          echo "部署: $EXE"
          # Nginx 实际配置（/etc/nginx/sites-available/vxin）：
          #   location /downloads/ { alias /var/www/vxin-download/; }
          # 即 https://vxinchat.com/downloads/updates/latest.yml 对应服务器上的
          # /var/www/vxin-download/updates/latest.yml —— 不是 /var/www/downloads
          # 或 /var/www/html/downloads（历史遗留的错误假设，导致 latest.yml 404）。
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}" \
            "mkdir -p /var/www/vxin-download/updates"
          # 落地页固定下载链接：/downloads/vxin-windows-<version>-setup.exe（带版本号，见 landing/lib/content.ts）
          scp -i ~/.ssh/deploy_key "$EXE" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/vxin-download/$(basename "$EXE")"
          # electron-updater 更新源：EXE + latest.yml + .blockmap 必须同目录
          scp -i ~/.ssh/deploy_key "$EXE" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/vxin-download/updates/$(basename "$EXE")"
          for f in $(find artifacts -name latest.yml -o -name '*.blockmap'); do
            scp -i ~/.ssh/deploy_key "$f" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/vxin-download/updates/"
          done
          echo "✅ 已发布到 https://vxinchat.com/downloads/$(basename "$EXE")"
          echo "✅ 更新源: https://vxinchat.com/downloads/updates/latest.yml"
