name: Windows Desktop Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: npx vite build --mode desktop --outDir dist-desktop
        working-directory: web
      - run: npm ci
        working-directory: desktop-electron
      - name: Build NSIS installer on Windows
        run: npx electron-builder --win nsis --x64 --publish never
        working-directory: desktop-electron
      - name: Install isolated verification dependency
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/vxin-qa" --no-audit --no-fund playwright
      - name: Verify packaged app on Windows
        shell: pwsh
        env:
          QA_MODULES: ${{ runner.temp }}/vxin-qa/node_modules
          QA_OUTPUT: ${{ runner.temp }}/windows-evidence
        run: node desktop-electron/scripts/verify-packaged.cjs
      - name: Upload installer and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vxin-windows-setup
          path: |
            desktop-electron/dist/*.exe
            desktop-electron/dist/latest.yml
            desktop-electron/dist/*.blockmap
            ${{ runner.temp }}/windows-evidence
          if-no-files-found: error
          retention-days: 14
