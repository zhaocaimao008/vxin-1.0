name: 自动部署 V信后端

on:
  push:
    branches:
      - main
    paths:
      - 'backend-v2/**'
      - 'web/src/**'
      - 'web/public/**'
      - 'web/index.html'
      - 'web/vite.config.js'
      - 'web/package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read

jobs:
  test:
    name: 冒烟检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'   # 依赖要求 node >=20（aws-sdk 等），原 18 过低
          cache: 'npm'
          cache-dependency-path: backend-v2/package-lock.json

      - name: 安装依赖
        working-directory: backend-v2
        run: npm ci

      # 全套 npm test 依赖预置种子数据的 wechat.db，CI 空库跑不过；
      # 改为「冒烟加载」：用临时库把整个 app（含 schema 迁移 + 所有模块 require）加载一遍，
      # 能抓出语法/依赖/schema 等会导致线上崩溃的错误，作为部署闸门稳定可靠。
      - name: 冒烟加载 app
        working-directory: backend-v2
        run: node -e "require('./src/app'); console.log('✅ app 加载成功'); process.exit(0)"
        env:
          NODE_ENV: test
          # 必须 ≥32 字符，否则 config/index.js 的安全校验会 process.exit(1)，
          # 令冒烟检查失败、部署闸门永远关闭（此前每次 push 部署都被此卡死）。
          JWT_SECRET: ci-smoke-jwt-secret-0123456789abcdef
          DB_PATH: /tmp/vxin-ci-smoke.db

  # ── 部署闸门（除冒烟外，追加真实门禁，任一红则不部署）──
  backend-jest:
    name: 后端 Jest + 覆盖率下限
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend-v2/package-lock.json
      - name: 安装依赖
        working-directory: backend-v2
        run: npm ci
      - name: Jest 全套 + 覆盖率门禁（隔离测试库，不碰 wechat.db）
        working-directory: backend-v2
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:coverage

  web-gate:
    name: Web Lint + Capacitor 版本守护
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: 安装 web 依赖
        working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Capacitor 版本一致性
        working-directory: web
        run: npm run check:capacitor
      - name: ESLint（0 warning）
        working-directory: web
        run: npm run lint -- --max-warnings=0

  # ── 生产部署：日本服务器 45.77.131.33（self-hosted runner vxin-prod-deploy）──
  # 服务器挂过之后发现旧版是 SSH 到已死的香港机（DEPLOY_* secrets），永远红；
  # 改为在日本本机 runner 上本地执行部署，无公网 SSH、无 secrets 依赖。
  deploy:
    name: 部署到日本服务器（本地 self-hosted runner）
    needs: [test, backend-jest, web-gate]
    # 只部署 main 分支的 push / 手动 dispatch，避免任意分支手动触发覆盖线上
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vxin-prod-deploy]
    timeout-minutes: 30
    steps:
      - name: 部署到 /root/vxin-1.0（代码 + web + 后端 + pm2 重启）
        shell: bash
        run: |
          set -euo pipefail
          REPO=/root/vxin-1.0
          echo "📋 V信部署到日本 $(date) | sha=$GITHUB_SHA"
          PREV_SHA="$(git -C "$REPO" rev-parse HEAD 2>/dev/null || echo '')"

          echo "📥 拉取代码"
          git -C "$REPO" fetch origin main
          git -C "$REPO" reset --hard "$GITHUB_SHA"

          echo "🌐 构建 Web 前端并发布到 /var/www/vxin-web/app"
          cd "$REPO/web"
          npm ci --legacy-peer-deps
          npm run build
          rsync -a --delete dist/ /var/www/vxin-web/app/
          echo "✅ Web 已发布"

          echo "📦 安装后端生产依赖"
          cd "$REPO/backend-v2"
          npm ci --omit=dev

          echo "🚀 重启应用（pm2: vxin-backend）"
          pm2 delete vxin-server-v2 2>/dev/null || true
          pm2 restart vxin-backend --update-env || PORT=3002 pm2 start src/server.js --name vxin-backend
          pm2 save || true

          echo "🔄 Reload nginx"
          nginx -s reload 2>/dev/null || true

          echo "✅ 健康检查"
          sleep 5
          HEALTH_OK=0
          for i in $(seq 1 20); do
            if curl -s -m 3 http://127.0.0.1:3002/health | grep -q '"ok":true'; then
              echo "✅ 健康检查通过"; HEALTH_OK=1; break
            fi
            echo "等待启动... ($i/20)"; sleep 2
          done

          if [ "$HEALTH_OK" != "1" ]; then
            echo "❌ 新版本健康检查失败，自动回滚到 $PREV_SHA"
            git -C "$REPO" reset --hard "$PREV_SHA"
            cd "$REPO/backend-v2"
            pm2 restart vxin-backend --update-env || true
            echo "🚨 回滚执行完毕，需人工检查 pm2 logs vxin-backend"
            exit 1
          fi
          echo "🎉 部署完成 $(date)"
