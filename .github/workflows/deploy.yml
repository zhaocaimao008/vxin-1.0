name: 自动部署 V信后端

on:
  push:
    branches:
      - main
    paths:
      - 'backend-v2/**'
      - 'web/src/**'
      - 'web/public/**'
      - 'web/index.html'
      - 'web/vite.config.js'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'deploy/release.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      check_only:
        type: boolean
        default: false
        description: '仅检查生产环境，不发布' 

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  readiness:
    if: github.event_name == 'workflow_dispatch' && inputs.check_only
    runs-on: [self-hosted, linux, x64, vxin-prod-deploy]
    timeout-minutes: 5
    steps:
      - name: Inspect current installation without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          REPO=/root/vxin-1.0
          git -C "$REPO" rev-parse HEAD
          git -C "$REPO" status --short
          git -C "$REPO" log -5 --oneline
          git -C "$REPO" log --oneline origin/main..HEAD
          git -C "$REPO" diff --stat origin/main HEAD
          git -C "$REPO" remote get-url origin | sed -E 's#(https?://)[^/@]+:[^/@]+@#\1[redacted]@#'
          git -C "$REPO" rev-parse origin/main
          if [ "$(git -C "$REPO" rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git -C "$REPO" bundle create "$RUNNER_TEMP/vxin-production.bundle" origin/main..HEAD
          fi
          df -h "$REPO" /var/www/vxin-web/app
          node --version
          test -s /var/www/vxin-web/app/index.html
          pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(JSON.parse(s).map(p=>({name:p.name,status:p.pm2_env.status,cwd:p.pm2_env.pm_cwd,script:p.pm2_env.pm_exec_path})))));'
          curl --fail --silent --max-time 10 http://127.0.0.1:3002/health
          cd "$REPO/backend-v2"
          node <<'NODE'
          const fs = require('fs');
          const env = require('dotenv').parse(fs.readFileSync('.env'));
          const fields = ['JWT_SECRET','ADMIN_JWT_SECRET','TURN_SECRET','TURN_URLS','VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','FIREBASE_PROJECT_ID','FIREBASE_CLIENT_EMAIL','FIREBASE_PRIVATE_KEY','APNS_KEY_ID','APNS_TEAM_ID','APNS_P8','GETUI_APP_ID','GETUI_APP_KEY','GETUI_MASTER_SECRET','ASR_URL','SERVICE_TOKEN','S3_BUCKET','S3_ACCESS_KEY_ID','S3_SECRET_ACCESS_KEY','SMS_ACCESS_KEY_ID'];
          console.log(JSON.stringify(Object.fromEntries(fields.map(k => [k, !!env[k]]))));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: production-local-commits
          path: ${{ runner.temp }}/vxin-production.bundle
          retention-days: 7
          if-no-files-found: ignore


  test:
    if: ${{ !inputs.check_only }}
    name: 冒烟检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'   # 依赖要求 node >=20（aws-sdk 等），原 18 过低
          cache: 'npm'
          cache-dependency-path: backend-v2/package-lock.json

      - name: 安装依赖
        working-directory: backend-v2
        run: npm ci

      # 全套 npm test 依赖预置种子数据的 wechat.db，CI 空库跑不过；
      # 改为「冒烟加载」：用临时库把整个 app（含 schema 迁移 + 所有模块 require）加载一遍，
      # 能抓出语法/依赖/schema 等会导致线上崩溃的错误，作为部署闸门稳定可靠。
      - name: 冒烟加载 app
        working-directory: backend-v2
        run: node -e "require('./src/app'); console.log('✅ app 加载成功'); process.exit(0)"
        env:
          NODE_ENV: test
          # 必须 ≥32 字符，否则 config/index.js 的安全校验会 process.exit(1)，
          # 令冒烟检查失败、部署闸门永远关闭（此前每次 push 部署都被此卡死）。
          JWT_SECRET: ci-smoke-jwt-secret-0123456789abcdef
          DB_PATH: /tmp/vxin-ci-smoke.db

  # ── 部署闸门（除冒烟外，追加真实门禁，任一红则不部署）──
  backend-jest:
    if: ${{ !inputs.check_only }}
    name: 后端 Jest + 覆盖率下限
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend-v2/package-lock.json
      - name: 安装依赖
        working-directory: backend-v2
        run: npm ci
      - name: Jest 全套 + 覆盖率门禁（隔离测试库，不碰 wechat.db）
        working-directory: backend-v2
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:coverage

  web-gate:
    if: ${{ !inputs.check_only }}
    name: Web Lint + Capacitor 版本守护
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: 安装 web 依赖
        working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Capacitor 版本一致性
        working-directory: web
        run: npm run check:capacitor
      - name: ESLint（0 warning）
        working-directory: web
        run: npm run lint -- --max-warnings=0

  # ── 生产部署：日本服务器 45.77.131.33（self-hosted runner vxin-prod-deploy）──
  # 服务器挂过之后发现旧版是 SSH 到已死的香港机（DEPLOY_* secrets），永远红；
  # 改为在日本本机 runner 上本地执行部署，无公网 SSH、无 secrets 依赖。
  deploy:
    name: 部署到日本服务器（本地 self-hosted runner）
    needs: [test, backend-jest, web-gate]
    # 只部署 main 分支的 push / 手动 dispatch，避免任意分支手动触发覆盖线上
    if: github.ref == 'refs/heads/main' && !inputs.check_only
    runs-on: [self-hosted, linux, x64, vxin-prod-deploy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 隔离构建、发布与完整失败回滚
        shell: bash
        env:
          REPO_DIR: /root/vxin-1.0
          WEB_ROOT: /var/www/vxin-web/app
          STATE_ROOT: /var/lib/vxin-releases
          PM2_APP: vxin-backend
          HEALTH_URL: http://127.0.0.1:3002/health
          CONFIGURE_WEB_PUSH: '1'
        run: |
          set -euo pipefail
          git -C "$REPO_DIR" fetch origin main
          bash deploy/release.sh "$GITHUB_SHA"
