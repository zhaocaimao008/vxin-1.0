name: Android Build
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful signed release workflow run to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  emulator-smoke:
    name: Verify signed release on Android 34
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vxin-release-apk
          path: apk
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash e2e/scripts/android-launch-smoke.sh && python3 e2e/scripts/native-live-acceptance.py android
        env:
          VXIN_ACCEPTANCE_ACCOUNTS_JSON: ${{ secrets.VXIN_ACCEPTANCE_ACCOUNTS_JSON }}
          QA_OUTPUT: android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: android-smoke/
          if-no-files-found: error
