name: Production readiness (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: [self-hosted, linux, x64, vxin-prod-deploy]
    timeout-minutes: 5
    steps:
      - name: Inspect current installation without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          REPO=/root/vxin-1.0
          git -C "$REPO" rev-parse HEAD
          git -C "$REPO" status --short
          git -C "$REPO" log -5 --oneline
          git -C "$REPO" log --oneline origin/main..HEAD
          git -C "$REPO" diff --stat origin/main HEAD
          git -C "$REPO" remote get-url origin | sed -E 's#(https?://)[^/@]+:[^/@]+@#\1[redacted]@#'
          git -C "$REPO" rev-parse origin/main
          df -h "$REPO" /var/www/vxin-web/app
          node --version
          nginx -T 2>/dev/null | awk '/^# configuration file/{print} /^[[:space:]]*(server_name|root|alias|location)[[:space:]]/{print}'
          python3 - <<'PYNGINX'
          from pathlib import Path
          import re
          text = Path('/etc/nginx/conf.d/dipsin.conf').read_text()
          start = text.index('server_name vxinchat.com www.vxinchat.com;')
          block = text[start:]
          match = re.search(r'location (?:\^~\s+)?/uploads/\s*\{([^}]+)\}', block)
          print('Vxin uploads directives:', [line.strip() for line in match[1].splitlines() if re.match(r'\s*(alias|root|auth_request|proxy_pass|try_files|expires)\s', line)] if match else 'not found')
          PYNGINX
          test -s /var/www/vxin-web/app/index.html
          pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(JSON.parse(s).map(p=>({name:p.name,status:p.pm2_env.status,cwd:p.pm2_env.pm_cwd,script:p.pm2_env.pm_exec_path})))));'
          curl --fail --silent --max-time 10 http://127.0.0.1:3002/health
          cd "$REPO/backend-v2"
          node <<'NODE'
          const fs = require('fs');
          const env = require('dotenv').parse(fs.readFileSync('.env'));
          const fields = ['JWT_SECRET','ADMIN_JWT_SECRET','TURN_SECRET','TURN_URLS','VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','FIREBASE_PROJECT_ID','FIREBASE_CLIENT_EMAIL','FIREBASE_PRIVATE_KEY','APNS_KEY_ID','APNS_TEAM_ID','APNS_P8','GETUI_APP_ID','GETUI_APP_KEY','GETUI_MASTER_SECRET','ASR_URL','SERVICE_TOKEN','S3_BUCKET','S3_ACCESS_KEY_ID','S3_SECRET_ACCESS_KEY','SMS_ACCESS_KEY_ID'];
          console.log(JSON.stringify(Object.fromEntries(fields.map(k => [k, !!env[k]]))));
          NODE
