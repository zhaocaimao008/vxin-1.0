server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 100m;
  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  location = / { return 302 /app/; }
  location = /config.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"api":"","socket":"","cdn":""}';
  }
  location = /app { return 302 /app/; }
  location /app/ {
    try_files $uri $uri/ /app/index.html;
    add_header Cache-Control "no-cache";
  }
  location /app/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Keep authorization on private uploads; never serve their volume directly.
  location ~ ^/(api/|uploads/|downloads/|health$) {
    proxy_pass http://backend:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /socket.io/ {
    proxy_pass http://backend:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
}
