services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend-v2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT_V2: '3002'
      LISTEN_HOST: 0.0.0.0
      DB_PATH: /data/wechat.db
      UPLOADS_ROOT: /uploads
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET with at least 32 characters}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set a separate ADMIN_JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      INVITE_CODE: ${INVITE_CODE:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS_ONLY: 'true'
      TRACING_ENABLED: 'false'
      ENABLE_FAKE_RECHARGE: 'false'
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
    volumes: [sqlite_data:/data, uploads_data:/uploads]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health').then(async r=>{const x=await r.json();process.exit(r.ok&&x.ok&&x.db==='ok'?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports: ['${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80']
    depends_on:
      backend:
        condition: service_healthy
volumes:
  redis_data:
  sqlite_data:
  uploads_data:
