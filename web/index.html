<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!-- DNS 预解析和预连接（与实际生产域名一致）-->
    <link rel="dns-prefetch" href="//vxinchat.com" />
    <link rel="preconnect" href="https://vxinchat.com" crossorigin />
    <!-- 字体预连接（系统字体无需，保留作为 CDN 字体备用） -->
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Socket.IO 连接预热：WebSocket 握手提前，减少首次连接延迟 -->
    <!-- 注：preconnect 对 WebSocket 同样有效（共享 TCP 连接） -->

    <title>v信</title>
    <meta name="description" content="v信 - 极致体验的即时通讯应用" />
    <link rel="manifest" href="./manifest.json" />

    <!-- PWA 相关 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="v信" />
    <meta name="theme-color" content="#F5F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)" />
    <!-- 品牌图标：由 web/scripts/generate-brand-assets.py 生成；?v= 与 sw.js 的 SW_VERSION 同步，换图标时一起改 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20261009b" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=20261009b" />
    <link rel="alternate icon" href="./favicon.ico?v=20261009b" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=20261009b" />

    <!-- Critical CSS 内联：首屏必须样式，消除渲染阻塞，FCP ↓ ~200ms -->
    <style>
      /* ── Reset ── */
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { height: 100%; -webkit-text-size-adjust: 100%; }
      body {
        height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
                     'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #F5F6F2;
        color: #111111;
      }
      #root { height: 100%; }

      /* ── 启动 Splash（React 挂载前防白屏 / 防错色闪烁）── */
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #F5F6F2; gap: 16px;
      }
      #app-splash .logo {
        width: 72px; height: 72px;
        filter: drop-shadow(0 10px 24px rgba(23,107,82,.22));
      }
      #app-splash .logo svg { width: 100%; height: 100%; display: block; }
      #app-splash .spin {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(23,107,82,.14);
        border-top-color: #176B52;
        animation: appspin .75s linear infinite;
      }
      @keyframes appspin { to { transform: rotate(360deg); } }

      /* ── 首屏布局骨架（防止 CLS）── */
      :root {
        --color-bg: #F5F6F2;
        --color-sidebar: #fff;
        --color-primary: #176B52;
        color-scheme: light;
      }
      /* 已知主题偏好（用户在设置里选过 深色/浅色，或跟随系统且系统当前为深色）
         由下方内联脚本在渲染前同步写入 html[data-theme]，避免首屏闪烁成错误配色。
         没有该属性时才回退到 prefers-color-scheme（例如首次访问、清过 localStorage）。 */
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="dark"] body,
      html[data-theme="dark"] #app-splash { background: #111412; color: #ECEFEC; }
      html[data-theme="dark"] #app-splash .spin { border-color: rgba(46,149,115,.22); border-top-color: #2E9573; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { color-scheme: dark; }
        html:not([data-theme="light"]) body,
        html:not([data-theme="light"]) #app-splash { background: #111412; color: #ECEFEC; }
        html:not([data-theme="light"]) #app-splash .spin { border-color: rgba(46,149,115,.22); border-top-color: #2E9573; }
      }
    </style>
    <script>
      // 同步读取已保存的主题偏好，在首帧绘制前打到 <html> 上，避免 splash
      // 先闪一下与用户实际主题相反的配色（浅色用户看到深色一瞬 / 反之）。
      // 与 SettingsContext.jsx 的存储口径保持一致：wc_theme = 'light'|'dark'|'auto'。
      (function () {
        try {
          var t = localStorage.getItem('wc_theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
          else if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) { /* 隐私模式等 localStorage 不可用时，回退到 prefers-color-scheme */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="logo"><!-- brand:splash:start --><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#176B52"/><rect x="19" y="21" width="62" height="50" rx="19" fill="#FFFFFF"/><path d="M27 59.5 L22.6 79.4 Q22 82.6 24.9 81.1 L45 70 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/><polyline points="36 36.5 50 56.5 64 36.5" fill="none" stroke="#176B52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><!-- brand:splash:end --></div>
        <div class="spin"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
