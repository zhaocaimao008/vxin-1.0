<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!-- DNS 预解析和预连接（与实际生产域名一致）-->
    <link rel="dns-prefetch" href="//dipsin.com" />
    <link rel="preconnect" href="https://dipsin.com" crossorigin />
    <!-- 字体预连接（系统字体无需，保留作为 CDN 字体备用） -->
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Socket.IO 连接预热：WebSocket 握手提前，减少首次连接延迟 -->
    <!-- 注：preconnect 对 WebSocket 同样有效（共享 TCP 连接） -->

    <!-- 预加载关键资源 -->
    <link rel="modulepreload" href="/src/main.jsx" />

    <title>v信</title>
    <meta name="description" content="v信 - 极致体验的即时通讯应用" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA 相关 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="v信" />
    <meta name="theme-color" content="#16C55B" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Critical CSS 内联：首屏必须样式，消除渲染阻塞，FCP ↓ ~200ms -->
    <style>
      /* ── Reset ── */
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { height: 100%; -webkit-text-size-adjust: 100%; }
      body {
        height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
                     'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #1A2033;
        color: #e8e8e8;
      }
      #root { height: 100%; }

      /* ── 启动 Splash（React 挂载前防白屏）── */
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #1A2033; gap: 16px;
      }
      #app-splash .logo {
        width: 64px; height: 64px; border-radius: 16px;
        background: linear-gradient(135deg, #6D5AE6, #8A78EB);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -1px;
        box-shadow: 0 8px 24px rgba(109,90,230,.4);
      }
      #app-splash .spin {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.12);
        border-top-color: #8A78EB;
        animation: appspin .75s linear infinite;
      }
      @keyframes appspin { to { transform: rotate(360deg); } }

      /* ── 首屏布局骨架（防止 CLS）── */
      :root {
        --color-bg: #1A2033;
        --color-sidebar: #141824;
        --color-primary: #6D5AE6;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root { --color-bg: #f5f5f5; --color-sidebar: #fff; color-scheme: light; }
        body { background: #f5f5f5; color: #1a1a1a; }
        #app-splash { background: #f5f5f5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="logo">v信</div>
        <div class="spin"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
